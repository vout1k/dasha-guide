<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Создать ТЗ в Notion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f7f7f5;min-height:100vh;padding:20px;display:flex;align-items:flex-start;justify-content:center}
.card{background:#fff;border-radius:16px;padding:28px;max-width:460px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.09);margin-top:20px}
.logo{font-size:44px;text-align:center;margin-bottom:14px}
h1{font-size:19px;font-weight:700;text-align:center;margin-bottom:6px;color:#37352f}
.sub{font-size:13px;color:#999;text-align:center;margin-bottom:24px;line-height:1.5}
label{font-size:13px;font-weight:600;color:#37352f;display:block;margin-bottom:6px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:13px;font-family:monospace;color:#333;background:#fafafa;-webkit-appearance:none;outline:none;margin-bottom:16px}
input:focus{border-color:#000;background:#fff}
.hint{font-size:11px;color:#aaa;margin-top:-12px;margin-bottom:16px;line-height:1.5}
.btn{width:100%;padding:15px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;background:#000;transition:all .2s;-webkit-appearance:none}
.btn:active{background:#333}
.btn:disabled{background:#aaa;cursor:default}
#log{margin-top:16px;font-size:13px;line-height:1.9;border-radius:10px;padding:14px;display:none;word-break:break-all}
.ok{background:#e8f5e9;color:#1b5e20}
.err{background:#fce4ec;color:#880e4f}
.info{background:#e3f2fd;color:#0d47a1}
a{color:#1565c0;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📲</div>
  <h1>Создать ТЗ в Notion</h1>
  <p class="sub">Ассистент по рассылкам — все блоки, таблицы и оформление.</p>

  <label>Notion Token</label>
  <input type="text" id="token" placeholder="ntn_..." autocomplete="off" autocorrect="off" spellcheck="false">
  <p class="hint">notion.so/my-integrations → скопируй Internal Integration Secret</p>

  <button class="btn" id="btn" onclick="go()">Создать страницу →</button>
  <div id="log"></div>
</div>

<script>
var PARENT = "377dded983ed8087b302d3419e9a00b8";

function show(msg, cls) {
  var el = document.getElementById('log');
  el.style.display = 'block';
  el.className = cls || 'info';
  el.innerHTML = msg;
}

function tx(c,bold){var r={type:"text",text:{content:c}};if(bold)r.annotations={bold:true};return r;}
function bx(c){return tx(c,true);}
function para(p,col){return{object:"block",type:"paragraph",paragraph:{rich_text:p,color:col||"default"}};}
function h2(p){return{object:"block",type:"heading_2",heading_2:{rich_text:p,is_toggleable:false}};}
function h3(p){return{object:"block",type:"heading_3",heading_3:{rich_text:p,is_toggleable:false}};}
function dv(){return{object:"block",type:"divider",divider:{}};}
function bul(p){return{object:"block",type:"bulleted_list_item",bulleted_list_item:{rich_text:p}};}
function num(p){return{object:"block",type:"numbered_list_item",numbered_list_item:{rich_text:p}};}
function co(e,col,p){return{object:"block",type:"callout",callout:{rich_text:p,icon:{type:"emoji",emoji:e},color:col+"_background"}};}
function qt(p){return{object:"block",type:"quote",quote:{rich_text:p}};}
function trow(cells){return{object:"block",type:"table_row",table_row:{cells:cells.map(function(c){return[tx(c)]})}};}  
function tbl(rows,hdr){return{object:"block",type:"table",table:{table_width:rows[0].length,has_column_header:hdr!==false,has_row_header:false},children:rows.map(function(r){return trow(r)})};}

function blocks(){return[
  co("💡","blue",[bx("Коротко о позиции. "),tx("Ты — первая точка контакта клиента с агентством. Пишешь людям в Telegram, прогреваешь и передаёшь заинтересованных на созвон. От твоей работы зависит оборот агентства в "),bx("1 500 000 ₽ за лето"),tx(".")])  ,
  dv(),
  h2([bx("🏷️ Общая информация")]),
  tbl([["Параметр","Значение"],["📍 Формат","Удалённо, 2–3 часа в день"],["💰 Зарплата","20 000 – 110 000 ₽ / месяц"],["⚡ Тип задач","Telegram-рассылки, прогрев лидов"],["📅 Старт","Как можно скорее · июнь 2025"],["✉️ Контакт","@Kirill_konstantinvich"]]),
  dv(),
  h2([bx("📋 Задача")]),
  para([tx("Ты — первая точка контакта. Пишешь первым, прогреваешь, передаёшь тёплых лидов на созвон с операционным директором.")]),
  bul([bx("📲 50 ручных рассылок "),tx("в Telegram по выданной базе — строго по согласованному скрипту")]),
  bul([bx("🔥 Прогрев входящих "),tx("— выявляешь боль, задаёшь вопросы, доводишь до записи на созвон")]),
  bul([bx("🎯 Передача лидов "),tx("— готового клиента передаёшь ОД. Продажа воронки за 150к+ — уже не твоя задача")]),
  bul([bx("💎 Не сливаешь ни одного ответа "),tx("— каждый ответ потенциально 150 000 ₽, всё фиксируется")]),
  bul([bx("📊 Отчёт каждый вечер "),tx("— сам, без напоминаний: отправлено / ответили / заинтересовались / на созвон")]),
  qt([tx("«Ты не просто рассыльщик. Ты первая точка контакта клиента с агентством. От тебя зависит, выйдем ли мы на 1 млн за лето или нет.»")]),
  para([tx("— Кирилл Кузнецов, основатель агентства")],"gray"),
  dv(),
  h2([bx("⚙️ Как это работает")]),
  para([tx("Три шага — каждый день, без выходных.")]),
  num([bx("Рассылки. "),tx("50 сообщений по базе ежедневно. Скрипт выдаётся и согласовывается с ОД. Самодеятельность — не приветствуется.")]),
  num([bx("Обработка входящих. "),tx("Все ответы — в течение 1–2 часов. Прогрев, вопросы, довести до созвона. Тёплый лид передаёшь ОД.")]),
  num([bx("Отчёт каждый вечер. "),tx("Отправлено / ответили / заинтересовались / на созвон. Сам, без напоминаний.")]),
  co("🕐","gray",[bx("Твой день: "),tx("утром рассылки (~1.5 ч), днём входящие (~1 ч), вечером отчёт (5–10 мин). Всё остальное время — свободен.")]),
  dv(),
  h2([bx("🎯 KPI и конверсия")]),
  tbl([["Уровень","Продажи / мес","Зарплата"],["🟡 Минимум","3 продажи","20–30 000 ₽"],["🟢 План","5 продаж","30 000 ₽ + 20 000 ₽ / доп. продажа"],["🔥 Бог-продажник","6+ продаж","110 000+ ₽"]]),
  h3([bx("Математика конверсии")]),
  tbl([["Рассылок","Ответили ~8%","Созвоны","Продажи"],["1 000","~80","~16","1 продажа"],["3 000","~240","~48","3 продажи"],["5 000","~400","~80","5 продаж ✓"]]),
  co("📊","yellow",[bx("Вывод: "),tx("50 рассылок × 100 дней = 5 000 рассылок = ~5 продаж в месяц. Объём = деньги.")]),
  dv(),
  h2([bx("💰 Зарплата — подробно")]),
  para([tx("Никаких серых схем. Считается прозрачно.")]),
  tbl([["Уровень","Продажи / мес","Оклад","Бонус","Итого"],["🟡 Минимум","3","20–30 000 ₽","—","20–30 000 ₽"],["🟢 План","5","30 000 ₽","+20 000 ₽ / продажа сверх 3","70 000 ₽"],["🔥 Бог","6+","30 000 ₽","Повышенная ставка","110 000+ ₽"]]),
  h3([bx("Пример расчёта — 7 продаж за месяц")]),
  tbl([["Статья","Сумма"],["Базовый оклад (3 продажи)","30 000 ₽"],["4 доп. продажи × 20 000 ₽","80 000 ₽"],["Итого за месяц","110 000 ₽"]]),
  dv(),
  h2([bx("📏 Правила работы")]),
  num([bx("Отчёт каждый день "),tx("— сам, в конце дня, без напоминаний")]),
  num([bx("Скорость ответа "),tx("— все входящие в течение 1–2 часов")]),
  num([bx("Проблемы — сразу "),tx("— блок, нет базы, не получается → пишешь ОД немедленно")]),
  num([bx("Скрипт согласован "),tx("— самодеятельность в переписке с клиентами не приветствуется")]),
  num([bx("Дедлайны — свято "),tx("— не переносишь без предупреждения")]),
  h3([bx("❌ Прощаемся, если")]),
  co("🚫","red",[tx("• Несколько раз подряд не выполняется базовый минимум (3 продажи)\n• Переносишь дедлайны и не предупреждаешь\n• Недобросовестно относишься к отчётности\n• Теряешь тёплых клиентов из-за невнимательности")]),
  co("⚠️","gray",[tx("Это удалённая работа — но это не значит, что правил нет. Единственная разница с офисом: высокостоящий продукт, полностью удалённо.")]),
  dv(),
  h2([bx("🚀 Цель на лето 2025")]),
  tbl([["Метрика","Цель"],["Оборот агентства","1 500 000 ₽ за июнь–август"],["Продаж","10 воронок за 3 месяца"],["Рассылок","~15 000 за лето"]]),
  co("🔑","orange",[bx("Ты — ключевое звено этой системы. "),tx("Без тебя нет рассылок → нет продаж → нет агентства. Мы растём вместе.")]),
  dv(),
  h2([bx("✉️ Как откликнуться")]),
  co("✉️","blue",[bx("Напиши в Telegram: РАССЫЛКИ + пару слов о себе\n\n"),tx("→ @Kirill_konstantinvich")]),
  para([tx("Агентство Кирилла Кузнецова · Воронки продаж от 150 000 ₽ · Удалённо")],"gray")
];}

async function go() {
  var token = document.getElementById('token').value.trim();
  if (!token || token === 'ntn_...') {
    show('❌ Вставь токен из Notion (notion.so/my-integrations)', 'err');
    return;
  }

  var btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = '⏳ Создаём...';

  show('⏳ Подключаемся к Notion...', 'info');

  var payload = JSON.stringify({
    parent: {type:"page_id", page_id:PARENT},
    icon: {type:"emoji", emoji:"📲"},
    properties: {title:{title:[{type:"text",text:{content:"Ассистент по рассылкам — ТЗ"}}]}},
    children: blocks()
  });

  var headers = {
    "Authorization": "Bearer " + token,
    "Notion-Version": "2022-06-28",
    "Content-Type": "application/json"
  };

  var proxyUrl = "https://corsproxy.io/?https://api.notion.com/v1/pages";

  try {
    var resp = await fetch(proxyUrl, {method:"POST", headers:headers, body:payload});
    var raw = await resp.text();

    var data;
    try { data = JSON.parse(raw); }
    catch(e) {
      show('❌ Ответ прокси не JSON:<br><small>' + raw.slice(0,400) + '</small>', 'err');
      btn.disabled=false; btn.textContent='Попробовать снова'; return;
    }

    if (data.id) {
      var url = "https://www.notion.so/" + data.id.replace(/-/g,"");
      show('✅ Страница создана!<br><br><a href="' + url + '" target="_blank">👉 Открыть страницу в Notion</a>', 'ok');
      btn.textContent = '✅ Готово!';
    } else {
      show('❌ Notion: ' + (data.message || JSON.stringify(data).slice(0,300)), 'err');
      btn.disabled = false;
      btn.textContent = 'Попробовать снова';
    }
  } catch(e) {
    show('❌ Сеть: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = 'Попробовать снова';
  }
}
</script>
</body>
</html>
