<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Создать ТЗ в Notion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f7f7f5;min-height:100vh;padding:20px;display:flex;align-items:flex-start;justify-content:center}
.card{background:#fff;border-radius:16px;padding:28px;max-width:460px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.09);margin-top:20px}
.logo{font-size:44px;text-align:center;margin-bottom:14px}
h1{font-size:19px;font-weight:700;text-align:center;margin-bottom:6px;color:#37352f}
.sub{font-size:13px;color:#999;text-align:center;margin-bottom:24px;line-height:1.5}
label{font-size:13px;font-weight:600;color:#37352f;display:block;margin-bottom:6px}
input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:13px;font-family:monospace;color:#333;background:#fafafa;-webkit-appearance:none;outline:none;margin-bottom:16px}
input:focus{border-color:#000;background:#fff}
.hint{font-size:11px;color:#aaa;margin-top:-12px;margin-bottom:16px;line-height:1.5}
.btn{width:100%;padding:15px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;background:#000;transition:all .2s;-webkit-appearance:none}
.btn:active{background:#333}
.btn:disabled{background:#aaa;cursor:default}
#log{margin-top:16px;font-size:13px;line-height:1.9;border-radius:10px;padding:14px;display:none;word-break:break-all}
.ok{background:#e8f5e9;color:#1b5e20}
.err{background:#fce4ec;color:#880e4f}
.info{background:#e3f2fd;color:#0d47a1}
a{color:#1565c0;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📲</div>
  <h1>Создать ТЗ в Notion</h1>
  <p class="sub">Ассистент по рассылкам — основное ТЗ.</p>

  <label>Notion Token</label>
  <input type="text" id="token" placeholder="ntn_..." autocomplete="off" autocorrect="off" spellcheck="false">
  <p class="hint">notion.so/my-integrations → скопируй Internal Integration Secret</p>

  <button class="btn" id="btn" onclick="go()">Создать страницу →</button>
  <div id="log"></div>
</div>

<script>
var PARENT = "377dded983ed8087b302d3419e9a00b8";

function show(msg, cls) {
  var el = document.getElementById('log');
  el.style.display = 'block';
  el.className = cls || 'info';
  el.innerHTML = msg;
}

function tx(c,bold){var r={type:"text",text:{content:c}};if(bold)r.annotations={bold:true};return r;}
function bx(c){return tx(c,true);}
function para(p,col){return{object:"block",type:"paragraph",paragraph:{rich_text:p,color:col||"default"}};}
function h2(p){return{object:"block",type:"heading_2",heading_2:{rich_text:p,is_toggleable:false}};}
function dv(){return{object:"block",type:"divider",divider:{}};}
function bul(p){return{object:"block",type:"bulleted_list_item",bulleted_list_item:{rich_text:p}};}
function num(p){return{object:"block",type:"numbered_list_item",numbered_list_item:{rich_text:p}};}
function co(e,col,p){return{object:"block",type:"callout",callout:{rich_text:p,icon:{type:"emoji",emoji:e},color:col+"_background"}};}
function trow(cells){return{object:"block",type:"table_row",table_row:{cells:cells.map(function(c){return[tx(c)]})}};}  
function tbl(rows,hdr){return{object:"block",type:"table",table:{table_width:rows[0].length,has_column_header:hdr!==false,has_row_header:false,children:rows.map(function(r){return trow(r)})}};}

function blocks(){return[
  co("💡","blue",[bx("Коротко. "),tx("Пишешь людям в Telegram по базе, прогреваешь, передаёшь заинтересованных на созвон с Кириллом. Удалённо, 2–3 часа в день.")]),
  dv(),
  h2([bx("🏷️ Общая информация")]),
  tbl([["Параметр","Значение"],["📍 Формат","Удалённо, 2–3 часа в день"],["💰 Зарплата","2 500 – 60 000+ ₽ / месяц"],["📅 Старт","Как можно скорее"],["✉️ Контакт","@Kirill_konstantinvich"]]),
  dv(),
  h2([bx("📋 Что нужно делать")]),
  bul([bx("📲 Рассылки "),tx("— 50 сообщений в день по выданной базе, строго по скрипту")]),
  bul([bx("🔥 Прогрев входящих "),tx("— отвечаешь на ответы, выявляешь интерес, доводишь до созвона")]),
  bul([bx("📊 Ежедневный отчёт "),tx("— сам, вечером: отправлено / ответили / на созвон")]),
  co("🕐","gray",[bx("Твой день: "),tx("утром рассылки (~1.5 ч), днём входящие (~1 ч), вечером отчёт (5 мин).")]),
  dv(),
  h2([bx("💰 Зарплата")]),
  tbl([["Результат","Оплат"],["⚠️ 0 продаж","2 500 ₽"],["🟡 1 продажа","10 000 ₽ (поощрительные)"],["🟢 3 продажи — план","40 000 ₽"],["🔥 4 продажи","60 000 ₽"]]),
  co("📊","yellow",[bx("Система: "),tx("выполняешь план (3 продажи) — получаешь 40к. Каждая продажа сверх — ещё +10к.")]),
  dv(),
  h2([bx("📏 Правила")]),
  num([bx("Отчёт каждый день "),tx("— сам, без напоминаний")]),
  num([bx("Отвечать на входящие "),tx("— в течение 1–2 часов")]),
  num([bx("Не сливать ответы "),tx("— каждый ответ = потенциальная продажа")]),
  num([bx("Скрипт согласован "),tx("— самодеятельность не приветствуется")]),
  co("🚫","red",[tx("Расстаёмся если: нет продаж несколько раз подряд, пропадаешь без предупреждения, теряешь клиентов из-за невнимательности.")]),
  dv(),
  h2([bx("✉️ Откликнуться")]),
  co("✉️","blue",[bx("Напиши в Telegram: РАССЫЛКИ + пару слов о себе\n\n"),tx("→ @Kirill_konstantinvich")]),
  para([tx("Агентство Кирилла Кузнецова · Воронки продаж · Удалённо")],"gray")
];}

async function go() {
  var token = document.getElementById('token').value.trim();
  if (!token || token === 'ntn_...') {
    show('❌ Вставь токен из Notion (notion.so/my-integrations)', 'err');
    return;
  }

  var btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = '⏳ Создаём...';

  show('⏳ Подключаемся к Notion...', 'info');

  var payload = JSON.stringify({
    parent: {type:"page_id", page_id:PARENT},
    icon: {type:"emoji", emoji:"📲"},
    properties: {title:{title:[{type:"text",text:{content:"Ассистент по рассылкам — ТЗ"}}]}},
    children: blocks()
  });

  var headers = {
    "Authorization": "Bearer " + token,
    "Notion-Version": "2022-06-28",
    "Content-Type": "application/json"
  };

  var proxyUrl = "https://corsproxy.io/?https://api.notion.com/v1/pages";

  try {
    var resp = await fetch(proxyUrl, {method:"POST", headers:headers, body:payload});
    var raw = await resp.text();

    var data;
    try { data = JSON.parse(raw); }
    catch(e) {
      show('❌ Ответ прокси не JSON:<br><small>' + raw.slice(0,400) + '</small>', 'err');
      btn.disabled=false; btn.textContent='Попробовать снова'; return;
    }

    if (data.id) {
      var url = "https://www.notion.so/" + data.id.replace(/-/g,"");
      show('✅ Страница создана!<br><br><a href="' + url + '" target="_blank">👉 Открыть страницу в Notion</a>', 'ok');
      btn.textContent = '✅ Готово!';
    } else {
      show('❌ Notion: ' + (data.message || JSON.stringify(data).slice(0,300)), 'err');
      btn.disabled = false;
      btn.textContent = 'Попробовать снова';
    }
  } catch(e) {
    show('❌ Сеть: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = 'Попробовать снова';
  }
}
</script>
</body>
</html>
